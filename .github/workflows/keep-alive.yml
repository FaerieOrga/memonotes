name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 * * *'  # Tous les jours à 3h UTC
  workflow_dispatch:     # Permet le lancement manuel

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -s -f "https://cxsjwqjcxzmznntrmlsr.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
