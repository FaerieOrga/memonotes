name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 * * *'  # Exécuté tous les jours à 3h UTC
  workflow_dispatch:     # Permet de lancer manuellement depuis GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase with SQL query
        run: |
          curl -s "https://cxsjwqjcxzmznntrmlsr.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"operation": "select", "query": "SELECT 1"}'
