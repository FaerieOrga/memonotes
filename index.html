<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1208" />
    <link rel="icon" href="https://raw.githubusercontent.com/FaerieOrga/images-forum/main/logo32%20copie.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <title>Mémo · Notes & Rappels</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Script pour intégrer le bouton NotesFaérie à côté des onglets -->
   <style>
  .btn-notesfaerie {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border-radius: 10px;
    color: #6b6b6b;
    font: inherit;
    font-size: 15px;
    text-decoration: none;
    white-space: nowrap;
  }
  .btn-notesfaerie:hover { background: rgba(0, 0, 0, 0.05); }
</style>
<script>
  window.addEventListener('load', function() {
    var observer = new MutationObserver(function() {
      var nav = document.querySelector('nav') || document.querySelector('header') || document.querySelector('.tabs') || document.querySelector('#root > div > div');
      if (nav && !document.querySelector('.btn-notesfaerie')) {
        var link = document.createElement('a');
        link.href = 'https://faerieorga.github.io/notesfaerie/';
        link.className = 'btn-notesfaerie';
        link.innerHTML = '📝 Journal de bord';
        nav.appendChild(link);

        // Sur petit écran : les onglets passent à la ligne au lieu d'être tronqués
        nav.style.flexWrap = 'wrap';
        nav.style.justifyContent = 'center';
        nav.style.rowGap = '6px';
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  });
</script>
  </body>
</html>
